# AIFlow Configuration File
# 配置优先级: 命令行参数 > 本地配置(.aiflow/config.yaml) > 全局配置(~/.config/aiflow/config.yaml) > 环境变量

# OpenAI API 配置 - 用于AI驱动的功能
openai:
  # OpenAI API 密钥 (必需) - 用于生成提交信息和代码分析
  key: your-openai-api-key

  # OpenAI API 基础URL (必需) - API请求的端点地址
  baseUrl: https://api.openai.com/v1

  # OpenAI 模型名称 (必需) - 指定使用的AI模型，如 gpt-3.5-turbo, gpt-4
  model: gpt-3.5-turbo
  
  # 模型最大上下文token数 (可选) - 手动指定模型的最大上下文长度，默认为8192
  # 常见模型推荐值：
  #   gpt-3.5-turbo: 4096 或 16384 (取决于具体版本)
  #   gpt-4: 8192
  #   gpt-4-turbo/gpt-4o: 128000
  #   gpt-4o-mini: 128000
  #   claude-3.5-sonnet: 200000
  #   deepseek-v3: 64000
  #   qwen2.5: 32768
  # 💡 提示：查看您使用的模型文档以确定正确的上下文长度
  max_context_tokens: 16384

# Git 平台配置 - 支持多个Git托管平台及平台级设置
git_platforms:
  # GitHub 平台配置
  github.com:
    access_token: ghp_xxxxxxxxxxxxxxxxxxxxx

  # GitLab 平台配置 - 支持平台级 merge_request 设置
  gitlab.example.com:
    access_token: glpat-xxxxxxxxxxxxxxxxxxxxx
    merge_request:
      assignee: username1          # 单个指派人用户名
      assignees:                   # 多个指派人用户名列表
        - username1
        - username2
      reviewers:                   # 审查者用户名列表
        - reviewer1
        - reviewer2

  # Gitee 平台配置
  gitee.com:
    access_token: gitee_xxxxxxxxxxxxxxxxxxxxx

  # 您可以添加更多Git托管平台的配置
  # 格式:
  # hostname:
  #   access_token: your-token
  #   merge_request:  # 可选，仅 GitLab 平台支持
  #     assignee: username
  #     assignees: [username1, username2]
  #     reviewers: [reviewer1, reviewer2]

# 旧格式兼容性支持 (已弃用，建议使用 git_platforms)
# git_access_tokens:
#   github.com: ghp_xxxxxxxxxxxxxxxxxxxxx
#   gitlab.example.com: glpat-xxxxxxxxxxxxxxxxxxxxx

# Conan 包管理器配置 - 用于C++包管理和版本更新
conan:
  # Conan 远程仓库基础URL (Conan操作时必需) - Conan包仓库的API地址
  remoteBaseUrl: https://conan.example.com
  
  # Conan 远程仓库名称 (可选) - 默认使用的仓库名称，默认为'repo'
  remoteRepo: repo

# 企业微信通知配置 - 用于发送操作结果通知
wecom:
  # 启用企业微信通知 (可选) - 是否开启通知功能，默认为false
  enable: true
  
  # 企业微信机器人Webhook地址 (可选) - 用于发送通知消息的机器人地址
  webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your-key

# Git 合并请求配置 - 控制MR的默认行为
git:
  # 压缩提交 (可选) - 合并时是否将多个提交压缩为一个，默认为true
  squashCommits: true
  
  # 删除源分支 (可选) - 合并后是否删除源分支，默认为true
  removeSourceBranch: true
  
  # AI生成语言 (可选) - AI生成commit message和MR描述的语言，默认为en
  # 支持的语言代码: en, zh-CN, zh-TW, ja, ko, fr, de, es, ru, pt, it
  generation_lang: en

# 旧格式兼容性支持 (已弃用，建议使用 git_platforms.<hostname>.merge_request)
# merge_request:
#   # 注意：此配置格式已弃用
#   # 新格式: 在 git_platforms 下为每个 GitLab 平台单独配置 merge_request
#   # 使用用户名而非用户ID，系统会自动解析
#   assignee_id: 0
#   assignee_ids: []
#   reviewer_ids: []